<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>lista invertida</title>
  </head>
  <body>
    <main class="container">
      <h1>Laboratório de arrays</h1>
      <div class="content">
        <p class="explicacao">Array Simples!</p>
          <button id="botao1">Revelar Array!</button>
        <p aria-live="polite" class="texto" id="h1"></p>
        <p class="explicacao">Array com adição do número 6</p>
          <button id="botao2">Revelar Modificação</button>
        <p aria-live="polite" class="texto" id="h2"></p>
        <p class="explicacao">Array invertido</p>
          <button id="botao3">Revelar Inversão</button>
        <p aria-live="polite" class="texto" id="h3"></p>
        <form id="meuFormulario">
          <label for="novoValor">Novo valor:</label>
          <input type="text" id="novoValor" name="novoValor" required maxlength="120">
          <button type="submit">Adicionar</button>
          <p aria-live="polite" class="texto" id="h4"></p>
        </form>
        
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
